{% extends "base.html" %} {% from "macros/footer.html" import c_footer %} {%
block title %}Predict Image - Python Pro Quiz Time{% endblock %} {% block
content%}
<div
  class="d-flex flex-column justify-content-center align-items-center min-vh-100"
>
  <div
    class="card shadow"
    style="width: 32rem; max-width: 95%; border-radius: 8px"
  >
    <div class="card-body text-center p-4">
      <h5 class="card-title fw-bold mb-2">Classify your favorite images</h5>
      <h6 class="card-subtitle text-muted mb-4">
        Upload your image and let our model predict the class for you!
      </h6>

      <form method="POST" action="/predict" enctype="multipart/form-data">
        <div class="mb-4">
          <label for="imageInput" class="form-label text-muted"
            >Select a photo (PNG, JPG)</label
          >
          <input
            class="form-control"
            type="file"
            id="imageInput"
            name="image"
            accept=".png, .jpg, .jpeg"
          />
        </div>
        <img
          id="previewImage"
          src="#"
          alt="Preview Image"
          class="img-fluid mb-4 d-none max-h-300 border-radius-8"
        />

        <button
          type="submit"
          id="uploadBtn"
          class="btn btn-primary w-100"
          disabled
        >
          Run Classification
        </button>
      </form>
    </div>
  </div>
  {{ c_footer() }}
</div>

<script>
  const imageInput = document.getElementById("imageInput");
  const previewImage = document.getElementById("previewImage");
  const uploadBtn = document.getElementById("uploadBtn");

  imageInput.addEventListener("change", function () {
    const file = this.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        previewImage.src = e.target.result;
        previewImage.classList.remove("d-none");
        uploadBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    } else {
      previewImage.src = "#";
      previewImage.classList.add("d-none");
      uploadBtn.disabled = true;
    }
  });
</script>
{% endblock%}
